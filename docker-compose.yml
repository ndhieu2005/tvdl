services:
  mysql:
    image: mysql:8.0
    container_name: tvdl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - tvdl_mysql_data:/var/lib/mysql
    networks:
      - tvdl_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: tvdl_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tvdl_net
    # ports:
    #   - "127.0.0.1:3002:3000"  # uncomment for direct backend debugging

  frontend:
    build: ./frontend
    container_name: tvdl_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tvdl_net

volumes:
  tvdl_mysql_data:

networks:
  tvdl_net:
